name: amrfinderplus_update
description: |
  Download/update the AMRFinderPlus reference database
keywords:
  - "amr"
  - "amrfinderplus"
  - "database"
tools:
  - amrfinderplus:
      description: Identify antimicrobial resistance genes, point mutations and virulence factors
      homepage: https://github.com/ncbi/amr
      documentation: https://github.com/ncbi/amr/wiki
      doi: "10.1038/s41598-021-91456-0"
      licence:
        - "Public Domain"
input:
  []
output:
  db:
    - - "amrfinderdb.tar.gz":
          type: file
          description: Path to the tool/reference database directory or archive
  versions:
    - - "versions.yml":
          type: file
          description: File containing software versions
authors:
  - "@ajodeh-juma"
maintainers:
  - "@ajodeh-juma"
