name: metabat2_summarizedepths
description: |
  Summarize per-contig depth of coverage from a BAM file for MetaBAT2 binning
keywords:
  - "binning"
  - "coverage"
  - "metabat2"
tools:
  - metabat2:
      description: Efficient tool for accurately reconstructing genomes from complex microbial communities via metagenome assembly
      homepage: https://bitbucket.org/berkeleylab/metabat
      doi: "10.7717/peerj.7359"
      licence:
        - "BSD-3-Clause-LBNL"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM alignment file
    - index:
        type: file
        description: Index file
output:
  depth:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: Depth
authors:
  - "@ajodeh-juma"
maintainers:
  - "@ajodeh-juma"
