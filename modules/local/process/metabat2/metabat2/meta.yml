name: metabat2_metabat2
description: |
  Bin assembled contigs into genome bins with MetaBAT2
keywords:
  - "binning"
  - "metabat2"
  - "metagenomics"
tools:
  - metabat2:
      description: Efficient tool for accurately reconstructing genomes from complex microbial communities via metagenome assembly
      homepage: https://bitbucket.org/berkeleylab/metabat
      doi: "10.7717/peerj.7359"
      licence:
        - "BSD-3-Clause-LBNL"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - contigs:
        type: file
        description: Assembled contig sequences in FASTA format
    - depth:
        type: file
        description: Depth
output:
  tooshort:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.tooShort.fa":
          type: file
          description: Contigs excluded for being too short
  lowdepth:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.lowDepth.fa":
          type: file
          description: Low-depth contig bin
  unbinned:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.unbinned.fa":
          type: file
          description: Unbinned contig sequences
  membership:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.tsv":
          type: file
          description: Contig-to-bin membership TSV file
  binned_fastas:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*[!lowDepth|tooShort|unbinned].fa":
          type: file
          description: Per-bin genome FASTA file(s)
  versions:
    - - "versions.yml":
          type: file
          description: File containing software versions
authors:
  - "@ajodeh-juma"
maintainers:
  - "@ajodeh-juma"
